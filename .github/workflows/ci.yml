name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The module compiles against the core contracts (openelis-spi,
# openelis-module-api) and the core's classes (openelisglobal:classes), which
# are not published to a remote repository yet: the workflow checks out
# OpenELIS Global at the branch the module targets and installs them locally,
# cached by the core commit so a module change does not rebuild the core.
# Repository variables CORE_REPOSITORY and CORE_REF override the source.
env:
  CORE_REPOSITORY: ${{ vars.CORE_REPOSITORY || 'DIGI-UW/OpenELIS-Global-2' }}
  CORE_REF: ${{ vars.CORE_REF || 'modula' }}

jobs:
  build:
    name: Build and test the module
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out OpenELIS Global
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core
          submodules: false

      - name: Name the core commit
        id: core
        run: echo "sha=$(git -C core rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the installed core artifacts
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/openelisglobal
          key: core-artifacts-${{ steps.core.outputs.sha }}

      - name: Cache the other Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/openelisglobal
          key: maven-${{ hashFiles('pom.xml', 'core/pom.xml', 'core/module-contracts/**/pom.xml') }}
          restore-keys: maven-

      - name: Install the core contracts and classes
        if: steps.core-cache.outputs.cache-hit != 'true'
        working-directory: core
        run: |
          git submodule update --init dataexport
          mvn -q -f dataexport/pom.xml install -DskipTests -Dmaven.test.skip=true
          mvn -q -f module-contracts/pom.xml install -DskipTests
          mkdir -p frontend/src/languages
          mvn -q install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true
          mvn -q -f module-test/pom.xml install -DskipTests

      - name: Build the module (backend tests, frontend build and tests, JAR)
        run: mvn -B verify

      - name: Upload the module JAR
        uses: actions/upload-artifact@v4
        with:
          name: specimen-followup-module
          path: target/specimen-followup-*.jar
